# Pixeo Publish: despliegue de producción (fork de Postiz v2.26.0, AGPL-3.0).
# Sin Elasticsearch: Temporal usa visibilidad en Postgres.
# No publica puertos en el host: el proxy inverso (Caddy) entra por la red externa `proxy`.
# Los nombres de servicio llevan el prefijo pp- para no chocar con los alias
# de otros stacks que comparten la red del proxy (por ejemplo «postgres» o «redis»).
name: pixeo-publish

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pp-app:
    image: ${PP_IMAGE:-ghcr.io/gitroomhq/postiz-app:v2.26.0}
    container_name: pixeo-publish-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pixeo:${PP_DB_PASSWORD}@pp-postgres:5432/pixeo_publish
      REDIS_URL: redis://pp-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: pp-temporal:7233
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
      NODE_OPTIONS: --max-old-space-size=640
    volumes:
      - pp-config:/config
      - pp-uploads:/uploads
    networks: [interna, proxy]
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 2.0
    logging: *logging
    depends_on:
      pp-postgres: { condition: service_healthy }
      pp-redis: { condition: service_healthy }
      pp-temporal: { condition: service_started }

  pp-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixeo
      POSTGRES_PASSWORD: ${PP_DB_PASSWORD}
      POSTGRES_DB: pixeo_publish
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    volumes:
      - pp-postgres:/var/lib/postgresql/data
    networks: [interna]
    mem_limit: 384m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixeo -d pixeo_publish"]
      interval: 10s
      timeout: 3s
      retries: 5

  pp-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - pp-redis:/data
    networks: [interna]
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pp-temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${PP_TEMPORAL_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=60"]
    volumes:
      - pp-temporal-db:/var/lib/postgresql/data
    networks: [interna]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 3s
      retries: 5

  pp-temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${PP_TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: pp-temporal-db
      ENABLE_ES: "false"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_NAMESPACE: default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [interna]
    mem_limit: 640m
    logging: *logging
    depends_on:
      pp-temporal-db: { condition: service_healthy }

volumes:
  pp-config:
  pp-uploads:
  pp-postgres:
  pp-redis:
  pp-temporal-db:

networks:
  interna:
  proxy:
    external: true
    name: ${PP_PROXY_NETWORK:-chatbotx_main}
