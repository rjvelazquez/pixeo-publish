# Landing estática de Pixeo Publish. Solo sirve la raíz y sus activos; todo lo demás
# (la app) lo enruta Caddy a pp-app, así que aquí cualquier otra ruta es 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Se declaran a nivel de server y los location solo usan «expires» (no add_header),
    # porque un add_header dentro de un location descartaría estos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
        expires 10m;
    }

    # Los activos no llevan hash en el nombre: 30 días, no un año, para que un cambio llegue.
    location /landing/ {
        try_files $uri =404;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        return 404;
    }
}
